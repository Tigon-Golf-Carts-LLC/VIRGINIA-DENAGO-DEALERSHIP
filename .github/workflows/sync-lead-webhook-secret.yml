# Copies the GitHub repository secret LEAD_WEBHOOK_URL (the TIGON IOT webhook
# URL for the "Contact form") into the Cloudflare Worker as a secret of the
# same name, where worker/index.js reads it to relay leads from /api/lead.
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   LEAD_WEBHOOK_URL       https://tigoniot.com/hooks/<this site's key>
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
#
# Runs on demand (Actions -> Sync lead webhook secret -> Run workflow) and
# whenever this workflow file changes on main. Re-run it after changing the
# GitHub secret.
name: Sync lead webhook secret

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-lead-webhook-secret.yml]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are present
        env:
          LEAD_WEBHOOK_URL: ${{ secrets.LEAD_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$LEAD_WEBHOOK_URL" ] || missing="$missing LEAD_WEBHOOK_URL"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing"
            exit 1
          fi
          case "$LEAD_WEBHOOK_URL" in
            https://tigoniot.com/hooks/*) ;;
            *) echo "::error::LEAD_WEBHOOK_URL must start with https://tigoniot.com/hooks/"; exit 1 ;;
          esac

      - name: Put LEAD_WEBHOOK_URL on the Worker
        env:
          LEAD_WEBHOOK_URL: ${{ secrets.LEAD_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$LEAD_WEBHOOK_URL" | npx --yes wrangler@4 secret put LEAD_WEBHOOK_URL --name virginia-denago-dealership
